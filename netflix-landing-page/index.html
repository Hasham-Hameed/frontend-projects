<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix-landing-project</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-image:
                linear-gradient(to bottom, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                url(tyson-moultrie-BQTHOGNHo08-unsplash.jpg);
            background-size: cover;
            color: white;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        img {
            width: 150px;
            margin-left: 60px;
            margin-top: 15px;
        }

        .sign-in-button {
            margin-right: 60px;
            margin-top: 15px;
            background-color: red;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 5px;
            font-weight: bold;
        }

        main {
            width: 600px;
            margin: 100px auto auto auto;
        }

        h1 {
            font-size: 55px;
            text-align: center;
            margin-bottom: 0;
        }

        .discount {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .email-entry {
            text-align: center;
            font-size: 20px;
            margin-top: 40px;
        }

        input {
            width: 355px;
            border: solid 1px white;
            background-color: rgba(0, 0, 0, 0.457);
            padding-top: 13px;
            padding-bottom: 13px;
            padding-left: 20px;
            color: white;
            border-radius: 15px;
            font-size: 18px;
        }

        .get-started {
            width: 200px;
            border: none;
            color: white;
            background-image: linear-gradient(to right, rgb(255, 139, 234), rgba(250, 46, 46, 0.562));
            padding-top: 13px;
            padding-bottom: 13px;
            border-radius: 25px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <header>
        <div class="netflix-logo">
            <img src="netflix-logo.png" alt="netflix logo">
        </div>
        <div class="sign-in">
            <button class="sign-in-button">Sign In</button>
        </div>
    </header>
    <main>
        <h1>Watch it before someone spoils it</h1>
        <p class="discount">Start at Rs 250.Cancel anytime.</p>
        <p class="email-entry">Ready to watch?Enter your email to create or restart your membership.</p>
        <form action="/submit-from-point" class="email">
            <input placeholder="Email address">
            <button class="get-started"> Get Started &gt;</button>
        </form>
    </main>
</body>

</html>
