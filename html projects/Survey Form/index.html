<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
</head>

<body>
    <h1>Platform Survey Form</h1>
    <p>Thankyou for taking the time to help us improve the platform</p>
    <form action="abc" id="survey-form">
        <label for="name">Name</label>
        <input type="text" id="name" required placeholder="Enter your name">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="Enter your Email">
        <label for="age">Age(Optional)</label>
        <input type="number" id="age" placeholder="Age" min="3" max="100">

        <p>Which option describes your current role?</p>
        <select name="roles" id="role">
            <option value="un-employed">Un employed</option>
            <option value="employed">Employed</option>
            <option value="student">Student</option>
        </select>
        <p>Would you recommend our platform to a friend?</p>
        <input type="radio" id="def" name="recommend" checked>
        <label for="def">Definitely</label>
        <input type="radio" id="maybe" name="recommend">
        <label for="maybe">Maybe</label>
        <input type="radio" id="ns" name="recommend">
        <label for="ns">Not sure</label>
        <p>What's your favorite feature of our platform?</p>
        <select name="features" id="feature">
            <option value="select">Select an option</option>
            <option value="accessibility">Accessibility</option>
            <option value="nothing">Nothing</option>
            <p>What would you like to see improved?(Check all that apply?)</p>
            <input type="checkbox" id="fe" name="improve">
            <label for="fe">Front-end development</label>
            <input type="checkbox" id="be" name="improve">
            <label for="be">Backend development</label>
            <input type="checkbox" id="fs" name="improve">
            <label for="fs">Full Stack projects</label>
        </select>
        <p>Any comments or suggestions?</p>
        <textarea name="comments" id="comments" rows="5" cols="25"></textarea>
        <button type="submit">Submit</button>
    </form>
</body>

</html>
